[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto_scraper_alexey"
version = "0.1.0"
# ... ваши остальные настройки (description, dependencies) ...

[tool.setuptools]
# Явно указываем, где искать пакеты
package-dir = {"" = "src_2"} # Замените 'src_1' на имя вашей папки с кодом (например, src_2)
packages = {find = {where = ["src_2"]}} # И здесь тоже замените на актуальное имя папки